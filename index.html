<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor Jurídico - Dorado</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background:#f9f6ef;
  padding:20px;
}

input, select, textarea {
  padding:10px;
  margin:5px 0;
  border:1px solid #c9a96e;
  border-radius:6px;
  width:100%;
  box-sizing: border-box;
}

textarea {
  height:150px;
}

button {
  padding:12px;
  background:#c9a96e;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight: bold;
  transition: all 0.3s ease;
}

button:hover {
  background:#b8935a;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.card {
  border:1px solid #e0d3b8;
  margin:10px 0;
  padding:10px;
  background:white;
  border-radius:8px;
  cursor:pointer;
  transition: all 0.3s ease;
}

.card:hover {
  background:#f5f0e8;
  border-color:#c9a96e;
  transform: translateX(5px);
}

.card.seleccionado {
  background:#c9a96e;
  border-color:#8b7355;
  color:white;
  border-width: 2px;
  box-shadow: 0 0 15px rgba(201, 169, 110, 0.5);
}

.card.seleccionado b {
  color:white;
}

.caso-seleccionado {
  display: none;
  background: linear-gradient(135deg, #c9a96e 0%, #b8935a 100%);
  border-radius: 8px;
  padding: 15px;
  margin: 15px 0;
  color: white;
  border-left: 5px solid #8b7355;
  animation: slideIn 0.4s ease;
}

.caso-seleccionado.activo {
  display: block;
}

.caso-seleccionado h4 {
  margin: 0 0 10px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.caso-seleccionado .checkmark {
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c9a96e;
  font-weight: bold;
  font-size: 14px;
}

.caso-seleccionado .detalles {
  font-size: 14px;
  margin-top: 8px;
  opacity: 0.95;
}

.caso-seleccionado button {
  background: white;
  color: #c9a96e;
  margin-top: 10px;
  padding: 8px 15px;
  font-size: 12px;
}

.caso-seleccionado button:hover {
  background: #f5f0e8;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.expediente-badge {
  display: inline-block;
  background: #e0d3b8;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 12px;
  margin-top: 5px;
}

.seccion {
  margin-bottom: 20px;
}

.seccion h3 {
  color: #8b7355;
  border-bottom: 2px solid #c9a96e;
  padding-bottom: 10px;
}

#estado {
  font-size: 12px;
  color: #8b7355;
  margin: 5px 0;
}

.loading {
  display: inline-block;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.error {
  background: #ffebee;
  border: 1px solid #ef5350;
  color: #c62828;
  padding: 10px;
  border-radius: 6px;
  margin: 10px 0;
}

.success {
  background: #e8f5e9;
  border: 1px solid #66bb6a;
  color: #2e7d32;
  padding: 10px;
  border-radius: 6px;
  margin: 10px 0;
}

button.guardar {
  background: #66bb6a;
}

button.guardar:hover {
  background: #558b2f;
}
</style>
</head>

<body>

<h2>⚖️ Editor Jurídico - Supabase</h2>

<div id="mensaje"></div>

<div class="seccion">
  <select id="abogado">
    <option value="facu">Facu</option>
    <option value="javier">Javier</option>
    <option value="alejandro">Alejandro</option>
  </select>

  <input id="parte" placeholder="Nombre de la parte">
</div>

<div class="seccion">
  <h3>🔎 Buscar expediente</h3>
  <input id="buscador" placeholder="Buscar...">
  <p id="estado"></p>
  <div id="resultados"></div>
</div>

<div class="caso-seleccionado" id="indicadorCaso">
  <h4>
    <span class="checkmark">✓</span>
    <span id="casoTitulo"></span>
  </h4>
  <div class="detalles">
    <span class="expediente-badge" id="casoExpediente"></span>
  </div>
  <button onclick="limpiarCaso()">✕ Deseleccionar</button>
</div>

<div class="seccion">
  <h3>✍️ Escrito</h3>
  <input id="titulo" placeholder="Título">
  <textarea id="cuerpo"></textarea>

  <button onclick="generarPDF()">📄 Generar PDF</button>
  <button class="guardar" onclick="guardarEscrito()">💾 Guardar en Supabase</button>
</div>

<script>

// Configuración de Supabase
const SUPABASE_URL = 'https://lzmawlqnifakmzwudkti.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2YWuP5GbRSdLpqR3AlaK3Q_ORD13xp1';

let supabase;

if(window.supabase && window.supabase.createClient) {
  const { createClient } = window.supabase;
  supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
} else {
  console.error('Supabase no cargó correctamente');
}

let abogados = {};
let datos = [];
let casoSeleccionado = null;

function mostrarMensaje(texto, tipo = 'info') {
  let div = document.getElementById('mensaje');
  div.className = tipo;
  div.innerText = texto;
  if(tipo !== 'error') {
    setTimeout(() => div.innerText = '', 3000);
  }
}

function limpiar(t){ return (t || "").toLowerCase(); }

async function cargarExpedientes() {
  try {
    document.getElementById('estado').innerText = '⏳ Cargando expedientes...';
    
    const { data, error } = await supabase
      .from('expedientes')
      .select('*');
    
    if(error) {
      throw new Error(error.message);
    }
    
    datos = data.map(item => ({
      id: item.id,
      texto: limpiar((item.caratula || '') + ' ' + (item.num_1inst || '')),
      caratula: item.caratula || '',
      expediente: item.num_1inst || '',
      num_1inst: item.num_1inst || ''
    }));
    
    document.getElementById('estado').innerText = `✔ ${datos.length} expedientes cargados desde Supabase`;
    mostrarMensaje('✔ Datos cargados correctamente', 'success');
  } catch(error) {
    console.error('Error cargando expedientes:', error);
    document.getElementById('estado').innerText = '❌ Error cargando datos';
    mostrarMensaje('Error: ' + error.message, 'error');
  }
}

async function cargarAbogados() {
  try {
    const { data, error } = await supabase
      .from('abogados')
      .select('*')
      .eq('activo', 1);
    
    if(error) {
      throw new Error(error.message);
    }
    
    let selectAbogado = document.getElementById('abogado');
    selectAbogado.innerHTML = '';
    
    data.forEach(abogado => {
      abogados[abogado.id] = {
        id: abogado.id,
        nombre: abogado.nombre,
        matricula: abogado.mp,
        domicilio_procesal: abogado.domicilio_procesal
      };
      
      let option = document.createElement('option');
      option.value = abogado.id;
      option.textContent = abogado.nombre;
      selectAbogado.appendChild(option);
    });
    
    console.log('Abogados cargados:', abogados);
  } catch(error) {
    console.error('Error cargando abogados:', error);
    mostrarMensaje('Error cargando abogados: ' + error.message, 'error');
  }
}

async function iniciar() {
  await cargarAbogados();
  await cargarExpedientes();
}

// Cargar datos al iniciar
iniciar();

document.getElementById('buscador').addEventListener('input', function(){
  let v = limpiar(this.value);
  let filtrados = datos.filter(d => d.texto.includes(v));
  let html = "";

  filtrados.forEach(item => {
    let seleccionado = casoSeleccionado && casoSeleccionado.id == item.id ? "seleccionado" : "";
    html += `
      <div class="card ${seleccionado}" 
           data-id="${item.id}" 
           data-caratula="${escapeHtml(item.caratula)}" 
           data-expediente="${item.numero_expediente}">
        <b>${item.caratula}</b><br>
        <span class="expediente-badge">${item.numero_expediente}</span>
      </div>
    `;
  });

  let resultadosDiv = document.getElementById('resultados');
  resultadosDiv.innerHTML = html;
  
  // Agregar event listeners a todos los cards
  resultadosDiv.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', function() {
      let id = this.getAttribute('data-id');
      let caratula = this.getAttribute('data-caratula');
      let expediente = this.getAttribute('data-expediente');
      seleccionarCaso(id, caratula, expediente);
    });
  });
});

function escapeHtml(text) {
  let map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function seleccionarCaso(id, caratula, expediente){
  casoSeleccionado = {id, caratula, expediente};
  
  let indicador = document.getElementById('indicadorCaso');
  document.getElementById('casoTitulo').innerText = caratula;
  document.getElementById('casoExpediente').innerText = "Expte. " + expediente;
  indicador.classList.add('activo');
  
  indicador.scrollIntoView({ behavior: "smooth", block: "nearest" });
  
  // Actualizar resaltado de cards
  document.querySelectorAll(".card").forEach(card => {
    let cardId = card.getAttribute('data-id');
    if(cardId === id) {
      card.classList.add("seleccionado");
    } else {
      card.classList.remove("seleccionado");
    }
  });
}

function limpiarCaso(){
  casoSeleccionado = null;
  document.getElementById('indicadorCaso').classList.remove('activo');
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('seleccionado');
  });
}

async function guardarEscrito() {
  if(!casoSeleccionado) {
    mostrarMensaje('Debes seleccionar un expediente', 'error');
    return;
  }

  let titulo = document.getElementById('titulo').value;
  let cuerpo = document.getElementById('cuerpo').value;
  let abogadoId = document.getElementById('abogado').value;
  let parte = document.getElementById('parte').value;

  if(!titulo || !cuerpo) {
    mostrarMensaje('Completa el título y cuerpo del escrito', 'error');
    return;
  }

  try {
    document.getElementById('mensaje').innerText = '⏳ Guardando...';

    const { data, error } = await supabase
      .from('escritos')
      .insert([{
        expediente_id: casoSeleccionado.id,
        abogado_id: abogadoId,
        caratula: casoSeleccionado.caratula,
        titulo: titulo,
        cuerpo: cuerpo,
        parte: parte,
        domicilio_procesal: abogados[abogadoId].domicilio_procesal,
        fecha_creacion: new Date().toISOString()
      }]);

    if(error) {
      throw new Error(error.message);
    }

    mostrarMensaje('✔ Escrito guardado correctamente', 'success');
    
    // Limpiar formulario
    document.getElementById('titulo').value = '';
    document.getElementById('cuerpo').value = '';

  } catch(error) {
    console.error('Error guardando:', error);
    mostrarMensaje('Error al guardar: ' + error.message, 'error');
  }
}

function generarPDF(){

  const { jsPDF } = window.jspdf;
  let doc = new jsPDF({ unit:"cm", format:"a4" });

  let abogadoId = document.getElementById("abogado").value;
  let ab = abogados[abogadoId];
  let parte = document.getElementById("parte").value || "...";
  let titulo = document.getElementById("titulo").value.toUpperCase();
  let cuerpo = document.getElementById("cuerpo").value;

  let expteLimpio = (casoSeleccionado?.expediente || "...").split(" - ")[0];

  let x = 4;
  let y = 4;
  let sangria = 1.25;
  let maxWidth = 15;

  let pageHeight = doc.internal.pageSize.getHeight();
  let margenInferior = 2;

  function checkPageBreak(){
    if(y > pageHeight - margenInferior){
      doc.addPage();
      y = 4;
    }
  }

  doc.setFont("courier");
  doc.setFontSize(13);

  if(titulo){
    doc.setFont("courier","bold");
    doc.text(titulo, x, y);

    let w = doc.getTextWidth(titulo);
    doc.setLineWidth(0.02);
    doc.line(x, y+0.08, x+w, y+0.08);

    y += 1;
    checkPageBreak();
  }

  doc.setFont("courier","normal");
  doc.text("SR. JUEZ:", x, y);
  y += 1;
  checkPageBreak();

  function escribirJustificado(linea, startX, ancho, isLast){

    let palabras = linea.split(" ");

    if(isLast){
      doc.text(linea, startX, y);
      y += 0.6;
      checkPageBreak();
      return;
    }

    let anchoTexto = doc.getTextWidth(linea);
    let espacios = palabras.length - 1;

    if(espacios <= 0){
      doc.text(linea, startX, y);
      y += 0.6;
      checkPageBreak();
      return;
    }

    let extra = (ancho - anchoTexto) / espacios;
    let currentX = startX;

    palabras.forEach((p, i) => {
      let palabraConEspacio = (i < palabras.length - 1) ? p + " " : p;

      doc.text(palabraConEspacio, currentX, y);
      currentX += doc.getTextWidth(palabraConEspacio);

      if(i < espacios){
        currentX += extra;
      }
    });

    y += 0.6;
    checkPageBreak();
  }

  let intro = `${ab.nombre}, Abogado, M.P. N°${ab.matricula}, apoderado de ${parte}, manteniendo domicilio procesal en Av. Belgrano N° 474, Piso 2 de esta ciudad y domicilio electrónico ${ab.matricula}, en autos caratulados: "${casoSeleccionado?.caratula || "..."}" (Expte. Nº ${expteLimpio}), a V.S. digo:`;

  let lineasIntro = doc.splitTextToSize(intro, maxWidth - sangria);

  lineasIntro.forEach((linea, i) => {
    let startX = (i === 0) ? x + sangria : x;
    let ancho = (i === 0) ? maxWidth - sangria : maxWidth;

    escribirJustificado(linea, startX, ancho, i === lineasIntro.length - 1);
  });

  y += 0.5;
  checkPageBreak();

  let parrafos = cuerpo.split("\n");

  parrafos.forEach(p => {

    let lineas = doc.splitTextToSize(p, maxWidth - sangria);

    lineas.forEach((linea, i) => {

      let startX = (i === 0) ? x + sangria : x;
      let ancho = (i === 0) ? maxWidth - sangria : maxWidth;

      escribirJustificado(linea, startX, ancho, i === lineas.length - 1);
    });

    y += 0.3;
    checkPageBreak();
  });

  doc.text(".", x + sangria, y);
  y += 0.7;
  checkPageBreak();

  doc.setFont("courier","bold");
  doc.text("SERÁ JUSTICIA", x + sangria, y);

  y += 2;
  checkPageBreak();

  doc.setFont("courier","normal");
  doc.setFontSize(8);

  doc.text(`Dr. ${ab.nombre}`, 10.5, y, {align:"center"});
  y += 0.4;
  doc.text(`M.P. N°${ab.matricula}`, 10.5, y, {align:"center"});

  doc.save("escrito.pdf");
}

</script>

</body>
</html>
